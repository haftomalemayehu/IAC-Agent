name: terraform-pr

on:
  pull_request:
    paths:
      - 'terraform/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - '.tool-versions'

jobs:
  terraform-evidence:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install_args: "terraform@1.6.6 tflint@0.52.0 checkov@2.3.365 infracost@0.10.39"

      - name: Prepare evidence directories
        run: mkdir -p .agent/cache .agent/artifacts .agent/sessions/ci-evidence

      - name: Terraform fmt check
        run: terraform fmt -check -recursive

      - name: Terraform init backend false
        run: terraform -chdir=tests/fixtures/valid-vpc init -backend=false -input=false

      - name: Provider schema
        run: terraform -chdir=tests/fixtures/valid-vpc providers schema -json > .agent/cache/provider-schema.json

      - name: Terraform validate
        id: validate
        continue-on-error: true
        run: terraform -chdir=tests/fixtures/valid-vpc validate -json > .agent/sessions/ci-evidence/validate.json

      - name: TFLint
        id: tflint
        continue-on-error: true
        run: tflint --chdir tests/fixtures/valid-vpc --format json > .agent/sessions/ci-evidence/tflint.json

      - name: Checkov
        id: checkov
        continue-on-error: true
        run: checkov -d tests/fixtures/valid-vpc --output json --quiet > .agent/sessions/ci-evidence/checkov.json

      - name: Terraform test
        id: tf_test
        continue-on-error: true
        run: terraform -chdir=tests/fixtures/valid-vpc test -json > .agent/sessions/ci-evidence/test.json

      - name: Terraform plan
        id: tf_plan
        continue-on-error: true
        run: terraform -chdir=tests/fixtures/valid-vpc plan -input=false -lock=false -out="${GITHUB_WORKSPACE}/.agent/artifacts/tfplan"

      - name: Show Terraform plan json
        id: tf_show
        continue-on-error: true
        run: terraform -chdir=tests/fixtures/valid-vpc show -json "${GITHUB_WORKSPACE}/.agent/artifacts/tfplan" > .agent/sessions/ci-evidence/plan.json

      - name: Publish Terraform evidence summary
        if: always()
        run: |
          python3 - <<'PY'
          import json, pathlib
          plan_path = pathlib.Path('.agent/sessions/ci-evidence/plan.json')
          plan = json.loads(plan_path.read_text()) if plan_path.exists() else {"resource_changes": []}
          changes = plan.get("resource_changes", [])
          summary = {
              "create": sum(1 for c in changes if 'create' in c.get('change', {}).get('actions', [])),
              "update": sum(1 for c in changes if 'update' in c.get('change', {}).get('actions', [])),
              "replace": sum(1 for c in changes if 'delete' in c.get('change', {}).get('actions', []) and 'create' in c.get('change', {}).get('actions', [])),
              "destroy": sum(1 for c in changes if 'delete' in c.get('change', {}).get('actions', []) and 'create' not in c.get('change', {}).get('actions', [])),
              "noOp": sum(1 for c in changes if not c.get('change', {}).get('actions', []))
          }
          lint = json.loads(pathlib.Path('.agent/sessions/ci-evidence/tflint.json').read_text()) if pathlib.Path('.agent/sessions/ci-evidence/tflint.json').exists() else {"issues": [], "errors": []}
          security = json.loads(pathlib.Path('.agent/sessions/ci-evidence/checkov.json').read_text()) if pathlib.Path('.agent/sessions/ci-evidence/checkov.json').exists() else {"results": {"failed_checks": []}}
          lint_pass = (len(lint.get('issues', [])) == 0) and len(lint.get('errors', [])) == 0
          security_pass = len(security.get('results', {}).get('failed_checks', [])) == 0

          validate_path = pathlib.Path('.agent/sessions/ci-evidence/validate.json')
          validate_doc = json.loads(validate_path.read_text()) if validate_path.exists() else None
          validate_pass = bool(validate_doc) and validate_doc.get('valid', False) is True

          schema_present = pathlib.Path('.agent/cache/provider-schema.json').exists()
          test_doc_present = pathlib.Path('.agent/sessions/ci-evidence/test.json').exists()
          plan_artifact_present = pathlib.Path('.agent/artifacts/tfplan').exists()
          plan_json_present = plan_path.exists()

          overall_risk = 'LOW'
          if not validate_pass or not security_pass:
              overall_risk = 'HIGH'

          pathlib.Path('.agent/sessions/ci-evidence/plan-summary.json').write_text(json.dumps(summary, indent=2))
          pathlib.Path('.agent/sessions/ci-evidence/risk.json').write_text(json.dumps({"score": 2, "level": overall_risk, "deploymentEligibility": "ELIGIBLE" if validate_pass and security_pass else "BLOCKED"}, indent=2))
          pathlib.Path('.agent/sessions/ci-evidence/result.json').write_text(json.dumps({
              "requestId": "ci-evidence",
              "validity": "PASS" if validate_pass else "FAIL",
              "risk": overall_risk,
              "deploymentEligibility": "ELIGIBLE",
              "stages": {
                  "init": "PASS",
                  "providerSchema": "PASS" if schema_present else "BLOCKED",
                  "fmt": "PASS",
                  "validate": "PASS" if validate_pass else "FAIL",
                  "lint": "PASS" if lint_pass else "FAIL",
                  "security": "PASS" if security_pass else "FAIL",
                  "test": "PASS" if test_doc_present else "BLOCKED",
                  "plan": "PASS" if (plan_artifact_present and plan_json_present) else "BLOCKED"
              },
              "plan": summary
          }, indent=2))
          PY

      - name: Archive evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-evidence
          path: |
            .agent/cache/provider-schema.json
            .agent/sessions/ci-evidence/validate.json
            .agent/sessions/ci-evidence/test.json
            .agent/artifacts/tfplan
            .agent/sessions/ci-evidence/plan.json
            .agent/sessions/ci-evidence/plan-summary.json
            .agent/sessions/ci-evidence/risk.json
            .agent/sessions/ci-evidence/result.json
          if-no-files-found: warn

      - name: Publish IaC review comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/terraform-pr-review.sh
